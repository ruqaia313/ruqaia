<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لأجمل رقية في الكون</title>
    <style>
        :root {
            --primary: #ff4d6d;
            --secondary: #c9184a;
            --glass: rgba(255, 255, 255, 0.9);
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(45deg, #ffafbd, #ffc3a0);
            overflow: hidden;
            transition: background 1s;
        }

        .main-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 85%;
            z-index: 100;
        }

        .hidden { display: none; opacity: 0; }
        .visible { display: block; opacity: 1; animation: fadeIn 1s forwards; }

        h1 { color: var(--secondary); font-size: 1.6rem; margin-bottom: 15px; }
        p { color: #444; line-height: 1.6; font-size: 1.1rem; }

        /* عداد الأيام */
        .counter-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
            background: rgba(255, 77, 109, 0.1);
            padding: 15px;
            border-radius: 20px;
        }
        .counter-box { font-weight: bold; color: var(--secondary); font-size: 1.2rem; }
        .counter-label { font-size: 0.8rem; color: #777; display: block; }

        .btn-group { display: flex; justify-content: center; gap: 20px; margin-top: 30px; position: relative; height: 50px; }
        button {
            padding: 10px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-yes { background: var(--primary); color: white; }
        .btn-no { background: #eee; color: #555; position: absolute; left: 50%; }

        .floating-heart { position: absolute; bottom: -50px; animation: floatUp linear infinite; z-index: 1; }
        @keyframes floatUp { to { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        #yt-player { position: absolute; top: -1000px; }
    </style>
</head>
<body>

    <div id="yt-player"></div>

    <div id="step0" class="main-card visible">
        <h1>اختبار سريع لرقية 🤔</h1>
        <p>هل أنا أحلى شي صار في حياتك؟</p>
        <div class="btn-group">
            <button class="btn-yes" onclick="goStep1()">أكيد! ❤️</button>
            <button id="btn-no" class="btn-no" onmouseover="moveButton()" onclick="moveButton()">لأ 😜</button>
        </div>
    </div>

    <div id="step1" class="main-card hidden">
        <h1>كفو! 😂</h1>
        <p>عشان كذا تستاهلي هالمفاجأة..</p>
        <button class="btn-yes" onclick="goStep2()">اسمعي هالأغنية ✨</button>
    </div>

    <div id="step2" class="main-card hidden">
        <h1>إلى رقية..</h1>
        <p id="typewriter"></p>
        <button id="finalBtn" class="btn-yes" style="display:none;" onclick="goStep3()">لحظة أخيرة ❤️</button>
    </div>

    <div id="step3" class="main-card hidden">
        <h1 style="font-size: 2.5rem;">❤️</h1>
        <h1>أحبكِ يا رقية</h1>
        <p>منذ عيد الفطر وحتى هذه اللحظة:</p>
        
        <div class="counter-container">
            <div class="counter-box"><span id="days">0</span><span class="counter-label">يوم</span></div>
            <div class="counter-box"><span id="hours">0</span><span class="counter-label">ساعة</span></div>
            <div class="counter-box"><span id="minutes">0</span><span class="counter-label">دقيقة</span></div>
            <div class="counter-box"><span id="seconds">0</span><span class="counter-label">ثانية</span></div>
        </div>
        
        <p style="margin-top:20px; font-weight:bold; color:var(--secondary);">يا أجمل عيون في الدنيا كلها.</p>
    </div>

    <script>
        const videoID = 'nZpUvEup85Y'; // عمرو دياب - برج الحوت
        const startTime = 14; 
        const startDate = new Date("2026-03-20T00:00:00"); // تاريخ عيد الفطر 2026

        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / (1000 * 60)) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('days').innerText = d;
            document.getElementById('hours').innerText = h;
            document.getElementById('minutes').innerText = m;
            document.getElementById('seconds').innerText = s;
        }
        setInterval(updateCounter, 1000);

        function moveButton() {
            const btn = document.getElementById('btn-no');
            const x = Math.random() * (window.innerWidth - btn.clientWidth);
            const y = Math.random() * (window.innerHeight - btn.clientHeight);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function goStep1() {
            document.getElementById('step0').style.display = 'none';
            document.getElementById('step1').classList.replace('hidden', 'visible');
        }

        function goStep2() {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').classList.replace('hidden', 'visible');
            player.seekTo(startTime);
            player.playVideo();
            startTypewriter();
            startHearts();
        }

        function startTypewriter() {
            const text = "من بين كل الناس عيني ما شافت غيرك.. رقية، شكراً لأنكِ كنتِ أجمل هدية في العيد وفي كل يوم.";
            let i = 0;
            const element = document.getElementById('typewriter');
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, 85);
                } else {
                    document.getElementById('finalBtn').style.display = 'inline-block';
                }
            }
            type();
        }

        function goStep3() {
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').classList.replace('hidden', 'visible');
            document.body.style.background = "#ff4d6d";
        }

        function startHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 6000);
            }, 300);
        }

        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', { height: '0', width: '0', videoId: videoID });
        }
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    </script>
</body>
</html>
