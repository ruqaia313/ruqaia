<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة إلى قلب رقية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap');
        :root { --accent: #ff2d55; --bg-dark: #1a1a1a; --glass: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; transition: all 0.4s ease; }
        body {
            margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg-dark);
            color: white; height: 100vh; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        .container {
            width: 90%; max-width: 450px; background: var(--glass); backdrop-filter: blur(15px);
            border-radius: 25px; padding: 35px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
            position: relative; z-index: 100;
        }
        .hidden { display: none !important; }
        h1 { color: var(--accent); font-size: 1.8rem; margin-bottom: 15px; }
        p { color: #ddd; line-height: 1.6; }
        .btn-main {
            background: linear-gradient(45deg, var(--accent), #ff708d);
            border: none; padding: 14px 35px; border-radius: 50px;
            color: white; font-weight: bold; cursor: pointer; margin-top: 20px;
        }
        input#ans {
            background: rgba(255,255,255,0.05); border: 2px solid var(--accent);
            color: white; padding: 12px; border-radius: 12px; width: 80%; text-align: center;
        }
        .memory-game { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .tile { 
            background: rgba(255,255,255,0.05); height: 65px; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.5rem;
        }
        .found { background: var(--accent) !important; }
        /* إخفاء فيديو اليوتيوب نهائياً */
        #player-wrapper { position: absolute; top: -5000px; left: -5000px; opacity: 0; }
    </style>
</head>
<body>
    <div id="player-wrapper"><div id="yt-player"></div></div>

    <div id="step1" class="container">
        <div style="font-size: 50px;">🌟</div>
        <h1>مرحباً رقية..</h1>
        <p>هذه الرحلة صُممت خصيصاً لكِ.. هل أنتِ مستعدة للدخول؟</p>
        <button class="btn-main" onclick="next(2)">ابدئي الآن ✨</button>
    </div>

    <div id="step2" class="container hidden">
        <h1>🔐 اختبار الهوية</h1>
        <p>ما هو اسم مشروع حبيبك البرمجي؟ (تلميح: ByteX)</p>
        <input type="text" id="ans" placeholder="اكتبي الاسم هنا..">
        <br>
        <button class="btn-main" onclick="check()">فك القفل</button>
    </div>

    <div id="step3" class="container hidden">
        <h1>🔍 جدي القلوب</h1>
        <p>ابحثي عن 3 قلوب مخفية لتفتحي المفاجأة:</p>
        <div class="memory-game" id="grid"></div>
    </div>

    <div id="step4" class="container hidden">
        <h1>أحبكِ جداً ❤️</h1>
        <p id="typewriter"></p>
        <p style="font-size: 0.9rem; color: var(--accent); margin-top: 20px;">يا أجمل عيون.. (برج الحوت ♓)</p>
    </div>

    <script>
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', { videoId: 'HcodxmdesfY', playerVars: { 'start': 14 } });
        }
        var tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(tag);

        function next(s) {
            document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
            document.getElementById('step'+s).classList.remove('hidden');
        }

        function check() {
            if(document.getElementById('ans').value.toLowerCase() === 'bytex') {
                initGame(); next(3);
            } else { alert("حاولي مرة ثانية! 😉"); }
        }

        let f = 0;
        function initGame() {
            const hPos = [1, 4, 7];
            for(let i=0; i<9; i++) {
                let t = document.createElement('div'); t.className = 'tile';
                t.onclick = () => {
                    if(hPos.includes(i) && !t.classList.contains('found')) {
                        t.innerHTML = '❤️'; t.classList.add('found'); f++;
                        if(f === 3) { next(4); startFinal(); }
                    } else { t.innerHTML = '❌'; setTimeout(()=> t.innerHTML='', 400); }
                };
                document.getElementById('grid').appendChild(t);
            }
        }

        function startFinal() {
            player.playVideo();
            const txt = "رقية.. أنتِ أجمل صدفة في حياتي، ومعكِ يكتمل كل شيء جميل. أحبكِ دائماً وأبداً.";
            let i = 0;
            function type() {
                if(i < txt.length) {
                    document.getElementById('typewriter').innerHTML += txt.charAt(i);
                    i++; setTimeout(type, 90);
                }
            }
            type();
        }
    </script>
</body>
</html>
