<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لأجمل رقية في الكون</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        :root { --primary: #ff4d6d; --secondary: #c9184a; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body {
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffdde1);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite; overflow: hidden;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .card {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 30px;
            padding: 35px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px; width: 90%; z-index: 100;
        }
        .hidden { display: none; }
        h1 { color: var(--secondary); font-size: 1.7rem; margin-bottom: 15px; }
        p { color: #444; font-size: 1.1rem; line-height: 1.6; }
        .btn-group { display: flex; justify-content: center; gap: 15px; position: relative; min-height: 60px; }
        button { padding: 12px 25px; border: none; border-radius: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-yes { background: var(--primary); color: white; }
        .btn-no { background: #eee; color: #555; position: absolute; }
        .counter-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .counter-item { background: #fff0f3; padding: 10px; border-radius: 15px; border: 1px solid #ffccd5; }
        .counter-value { display: block; font-size: 1.4rem; font-weight: bold; color: var(--secondary); }
        .counter-label { font-size: 0.8rem; color: #777; }
        .heart-particle { position: absolute; pointer-events: none; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }
        /* مشغل الفيديو مخفي تماماً */
        #yt-player { position: absolute; top: -1000px; left: -1000px; width: 1px; height: 1px; }
    </style>
</head>
<body>

    <div id="yt-player"></div>

    <div id="step0" class="card">
        <div style="font-size: 50px;">🤔</div>
        <h1>اختبار لرقية..</h1>
        <p>هل أنا أحلى شيء حصل لكِ في هذه السنة؟</p>
        <div class="btn-group">
            <button class="btn-yes" onclick="goStep1()">أكيد طبعاً! ❤️</button>
            <button id="btn-no" class="btn-no" onmouseover="moveButton()">لا 😜</button>
        </div>
    </div>

    <div id="step1" class="card hidden">
        <div style="font-size: 50px;">✨</div>
        <h1>كنت أعرف! 😂</h1>
        <p>بما أن إجابتكِ صحيحة، استعدي للمفاجأة..</p>
        <button class="btn-yes" onclick="goStep2()">افتحي المفاجأة 🎁</button>
    </div>

    <div id="step2" class="card hidden">
        <h1>إلى رقية..</h1>
        <p id="typewriter" style="min-height: 80px;"></p>
        <button id="finalBtn" class="btn-yes hidden" onclick="goStep3()">أكملي للنهاية ❤️</button>
    </div>

    <div id="step3" class="card hidden">
        <div style="font-size: 50px;">❤️</div>
        <h1>أحبكِ يا رقية</h1>
        <p>مرّت على صدفة العمر الجميلة:</p>
        <div class="counter-grid">
            <div class="counter-item"><span id="days" class="counter-value">0</span><span class="counter-label">يوم</span></div>
            <div class="counter-item"><span id="hours" class="counter-value">0</span><span class="counter-label">ساعة</span></div>
            <div class="counter-item"><span id="minutes" class="counter-value">0</span><span class="counter-label">دقيقة</span></div>
            <div class="counter-item"><span id="seconds" class="counter-value">0</span><span class="counter-label">ثانية</span></div>
        </div>
        <p style="margin-top:20px; font-weight:bold; color:var(--secondary);">يا أجمل عيون شفتها بحياتي.</p>
    </div>

    <script>
        // رابط بديل للأغنية لضمان العمل
        const videoID = 'HcodxmdesfY'; 
        const startTime = 14; 
        const startDate = new Date("2026-03-20T00:00:00"); 

        let player;
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '1', width: '1', videoId: videoID,
                playerVars: { 'start': startTime, 'autoplay': 0, 'controls': 0, 'enablejsapi': 1 }
            });
        }

        function moveButton() {
            const btn = document.getElementById('btn-no');
            btn.style.left = Math.random() * 70 + 'vw';
            btn.style.top = Math.random() * 70 + 'vh';
            btn.style.position = 'fixed';
        }

        function goStep1() {
            document.getElementById('step0').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
        }

        function goStep2() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            
            // محاولة تشغيل الأغنية بقوة بعد الضغط
            if (player && typeof player.playVideo === 'function') {
                player.setVolume(100);
                player.seekTo(startTime);
                player.playVideo();
            }
            
            startTypewriter();
            startHearts();
        }

        function startTypewriter() {
            const text = "من بين كل الناس، عيني لم تقع إلا عليكِ.. رقية، أنتِ أجمل صدفة غيرت حياتي، ومعكِ يكتمل عيدي كل يوم.";
            let i = 0;
            const element = document.getElementById('typewriter');
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, 80);
                } else {
                    document.getElementById('finalBtn').classList.remove('hidden');
                }
            }
            type();
        }

        function goStep3() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
            document.body.style.background = "#ff4d6d";
        }

        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;
            document.getElementById('days').innerText = Math.floor(diff / 86400000);
            document.getElementById('hours').innerText = Math.floor((diff / 3600000) % 24);
            document.getElementById('minutes').innerText = Math.floor((diff / 60000) % 60);
            document.getElementById('seconds').innerText = Math.floor((diff / 1000) % 60);
        }
        setInterval(updateCounter, 1000);

        function startHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart-particle');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '-20px';
                heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
                heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 6000);
            }, 300);
        }
    </script>
</body>
</html>
